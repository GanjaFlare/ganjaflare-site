    #particles-js {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .moving-coin-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .drift-coin {
      position: absolute;
      filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.4));
      opacity: 0.8;
      animation: driftAround 18s ease-in-out infinite alternate;
    }

    .drift-cat {
      position: absolute;
      top: 45%;
      left: 60%;
      width: 130px;
      filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.5));
      opacity: 0.9;
      animation: driftCatAnim 22s ease-in-out infinite alternate;
    }

    .coin-1 { top: 10%; left: 5%; width: 55px; animation-duration: 22s; }
    .coin-2 { top: 35%; right: 8%; width: 70px; animation-duration: 17s; animation-delay: -3s; }
    .coin-3 { top: 65%; left: 12%; width: 60px; animation-duration: 25s; animation-delay: -7s; }
    .coin-4 { top: 80%; right: 15%; width: 50px; animation-duration: 19s; animation-delay: -2s; }
    .coin-5 { top: 20%; right: 35%; width: 65px; animation-duration: 28s; animation-delay: -10s; }
    .coin-6 { top: 50%; left: 40%; width: 45px; animation-duration: 20s; animation-delay: -5s; }

    @keyframes driftAround {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      25% { transform: translate(120px, -80px) rotate(90deg) scale(1.1); }
      50% { transform: translate(-90px, 140px) rotate(180deg) scale(0.9); }
      75% { transform: translate(150px, 60px) rotate(270deg) scale(1.05); }
      100% { transform: translate(-100px, -120px) rotate(360deg) scale(1); }
    }

    @keyframes driftCatAnim {
      0% { transform: translate(0, 0) rotate(-5deg) scale(1); }
      33% { transform: translate(-180px, -120px) rotate(10deg) scale(1.15); }
      66% { transform: translate(120px, -200px) rotate(-15deg) scale(0.95); }
      100% { transform: translate(-80px, 100px) rotate(5deg) scale(1.05); }
    }

**実装方法のポイント**

* **ナビバーの文字列を直接記述（ハードコード）する**
  i18nなどの多言語化ライブラリ（`i18next` や `vue-i18n` など）を使用している場合、ヘッダー部分だけ翻訳キー（例: `t('nav.home')`）を使わず、表示したい言語のテキストを直接指定します。
