backend:
  name: git-gateway
  branch: main # GitHubのメインブランチ名（masterの場合は master に変更）

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string" }